name: Publish Vulkan image

on:
  push:
    branches: [master]
  pull_request:
    paths: [.devops/vulkan.Dockerfile, .github/workflows/docker.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vulkan-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'VitorCaleffi/strix-llama.cpp'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build existing Vulkan server target
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/source" release
          git archive HEAD | tar -x -C "$RUNNER_TEMP/source"
          docker buildx create --use
          docker buildx build --platform linux/amd64 --target server \
            --build-arg APP_REVISION="$SOURCE_SHA" --build-arg APP_VERSION="strix-$SOURCE_SHA" \
            --build-arg IMAGE_SOURCE="https://github.com/VitorCaleffi/strix-llama.cpp" \
            --build-arg IMAGE_URL="https://github.com/VitorCaleffi/strix-llama.cpp" \
            --build-arg BUILD_JOBS=2 --provenance=false \
            --output "type=oci,dest=$PWD/release/image.tar" \
            -f "$RUNNER_TEMP/source/.devops/vulkan.Dockerfile" "$RUNNER_TEMP/source"
      - name: Smoke test and scan the artifact
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          sudo apt-get update && sudo apt-get install -y skopeo
          skopeo copy oci-archive:release/image.tar docker-daemon:strix:test
          docker run --rm --network none strix:test --version 2>&1 | tee release/version.txt
          grep -F "$SOURCE_SHA" release/version.txt
          docker run --rm --network none strix:test --help > release/help.txt 2>&1
          for flag in --mmproj --spec-type --spec-draft-n-max --cache-ram --no-cache-idle-slots --api-key-file --metrics; do
            grep -F -- "$flag" release/help.txt
          done
          docker run --rm --network none --entrypoint sh strix:test -ec '
            for file in /app/llama-server /app/*.so*; do
              output=$(ldd "$file"); ! echo "$output" | grep "not found"
            done
            test -s /usr/share/licenses/strix/LICENSE
            find /usr/share/vulkan/icd.d -name "*radeon*" | grep .
            curl --version
          '
          docker run --rm --network none strix:test --verbose --list-devices 2>&1 | tee release/devices.txt
          grep -F 'loaded Vulkan backend' release/devices.txt
          scanner='aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969'
          scan() { docker run --rm -v "$PWD/release:/scan" "$scanner" image --input /scan/image.tar --scanners vuln "$@"; }
          scan --format cyclonedx --output /scan/sbom.json
          scan --format json --output /scan/vulnerabilities.json
          scan --ignore-unfixed --severity CRITICAL --exit-code 1
          sha256sum release/image.tar > release/image.tar.sha256
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: reports
          path: |
            release/*.json
            release/*.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tested-image
          path: |
            release/image.tar
            release/image.tar.sha256
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      packages: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tested-image
          path: release
      - name: Publish tested image
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          RELEASE_TAG: vulkan-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          sudo apt-get update && sudo apt-get install -y skopeo
          sha256sum --check release/image.tar.sha256
          image="ghcr.io/vitorcaleffi/strix-llama-cpp:$RELEASE_TAG"
          auth="$RUNNER_TEMP/auth.json"
          trap 'rm -f "$auth"' EXIT
          printf '%s' "$TOKEN" | skopeo login --authfile "$auth" -u "$ACTOR" --password-stdin ghcr.io
          if skopeo inspect --authfile "$auth" "docker://$image" >/dev/null 2> "$RUNNER_TEMP/inspect-error"; then
            echo 'Release tag exists; start a new workflow run.' >&2; exit 1
          fi
          grep -Eiq 'manifest unknown|name unknown|denied|404' "$RUNNER_TEMP/inspect-error"
          skopeo copy --authfile "$auth" --preserve-digests --digestfile release/digest \
            oci-archive:release/image.tar "docker://$image"
          printf '%s@%s\n' "$image" "$(cat release/digest)" > release/image-reference.txt
          cat release/image-reference.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-reference
          path: release/image-reference.txt
          if-no-files-found: error
      - name: Verify anonymous pull
        run: |
          mkdir "$RUNNER_TEMP/anonymous"
          DOCKER_CONFIG="$RUNNER_TEMP/anonymous" docker pull "$(cat release/image-reference.txt)"
